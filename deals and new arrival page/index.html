<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deals & New Arrivals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Deals & New Arrivals</h1>
  </header>

  <!-- Sorting & Filtering -->
  <section class="filters">
    <label for="sort">Sort by:</label>
    <select id="sort">
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
      <option value="newest">Newest</option>
      <option value="discount">Biggest Discount</option>
    </select>
  </section>

  <!-- Today's Deals -->
  <section class="deals">
    <h2>Today's Deals</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="images/product1.jpg" alt="Product 1">
        <h3>Smart Watch</h3>
        <p class="original-price">$100.00</p>
        <p class="discount">-30%</p>
        <p class="current-price">$70.00</p>
        <button>Add to Cart</button>
        <button class="wishlist">♡ Wishlist</button>
      </div>

      <div class="product-card">
        <img src="images/product2.jpg" alt="Product 2">
        <h3>Wireless Headphones</h3>
        <p class="original-price">$80.00</p>
        <p class="discount">-25%</p>
        <p class="current-price">$60.00</p>
        <button>Add to Cart</button>
        <button class="wishlist">♡ Wishlist</button>
      </div>
    </div>
  </section>

  <!-- Special Offers -->
  <section class="offers">
    <h2>Special Offers</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="images/product3.jpg" alt="Product 3">
        <h3>Gaming Laptop</h3>
        <p class="original-price">$1200.00</p>
        <p class="discount">-15%</p>
        <p class="current-price">$1020.00</p>
        <button>Add to Cart</button>
        <button class="wishlist">♡ Wishlist</button>
      </div>
    </div>
  </section>

  <!-- New Arrivals -->
  <section class="new-arrivals">
    <h2>New Arrivals</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="images/product4.jpg" alt="Product 4">
        <h3>Smartphone X</h3>
        <p class="current-price">$500.00</p>
        <button>Add to Cart</button>
        <button class="wishlist">♡ Wishlist</button>
      </div>
    </div>
  </section>
</body>
</html>
